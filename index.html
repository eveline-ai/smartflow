<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartflow – Prozesse. Einfach. Digital.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ivory:#FAFAF7;
  --stone:#F0EFE9;
  --ink:#1A1A18;
  --muted:#6B6B62;
  --accent:#1D6F5B;
  --accent-light:#E1F5EE;
  --accent-mid:#0F6E56;
  --border:#E2E0D8;
}
body{font-family:'DM Sans',sans-serif;background:var(--ivory);color:var(--ink);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}

nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 3rem;border-bottom:1px solid var(--border);background:var(--ivory);position:sticky;top:0;z-index:100}
.logo{font-family:'DM Serif Display',serif;font-size:1.5rem;letter-spacing:-0.02em;color:var(--ink)}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{font-size:0.9rem;color:var(--muted);font-weight:400;transition:color 0.2s}
.nav-links a:hover{color:var(--ink)}
.nav-cta{background:var(--accent);color:#fff !important;padding:0.5rem 1.25rem;border-radius:6px;font-size:0.875rem;font-weight:500;transition:background 0.2s !important}
.nav-cta:hover{background:var(--accent-mid) !important;color:#fff !important}

.hero{padding:6rem 3rem 5rem;max-width:860px;margin:0 auto;text-align:center}
.hero-tag{display:inline-block;background:var(--accent-light);color:var(--accent-mid);font-size:0.8rem;font-weight:500;padding:0.35rem 0.9rem;border-radius:20px;margin-bottom:1.75rem;letter-spacing:0.03em}
h1{font-family:'DM Serif Display',serif;font-size:3.5rem;line-height:1.15;letter-spacing:-0.03em;margin-bottom:1.5rem;color:var(--ink)}
h1 em{color:var(--accent);font-style:normal}
.hero p{font-size:1.15rem;color:var(--muted);max-width:560px;margin:0 auto 2.5rem;font-weight:300;line-height:1.7}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-primary{background:var(--accent);color:#fff;padding:0.85rem 2rem;border-radius:8px;font-size:0.95rem;font-weight:500;border:none;cursor:pointer;transition:background 0.2s}
.btn-primary:hover{background:var(--accent-mid)}
.btn-secondary{background:transparent;color:var(--ink);padding:0.85rem 2rem;border-radius:8px;font-size:0.95rem;font-weight:400;border:1px solid var(--border);cursor:pointer;transition:border-color 0.2s}
.btn-secondary:hover{border-color:#aaa}

.stats-bar{background:var(--stone);padding:2rem 3rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stats-inner{max-width:1100px;margin:0 auto;display:flex;gap:3rem;justify-content:center;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--accent)}
.stat-label{font-size:0.8rem;color:var(--muted)}

.section{padding:5rem 3rem;max-width:1100px;margin:0 auto}
.section-label{font-size:0.8rem;font-weight:500;letter-spacing:0.08em;color:var(--accent);text-transform:uppercase;margin-bottom:0.75rem}
h2{font-family:'DM Serif Display',serif;font-size:2.25rem;letter-spacing:-0.02em;line-height:1.2;margin-bottom:1rem}
.section-sub{color:var(--muted);max-width:520px;font-size:1rem;font-weight:300;line-height:1.7;margin-bottom:3rem}

.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.service-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:2rem;transition:border-color 0.2s}
.service-card:hover{border-color:var(--accent)}
.service-icon{width:44px;height:44px;background:var(--accent-light);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;font-size:1.25rem}
.service-card h3{font-size:1.05rem;font-weight:500;margin-bottom:0.5rem;letter-spacing:-0.01em}
.service-card p{font-size:0.9rem;color:var(--muted);line-height:1.6;font-weight:300}

.service-card.featured{
  border-color:var(--accent);
  background:linear-gradient(135deg,var(--accent-light) 0%,#fff 60%);
  position:relative;
  overflow:hidden;
}
.service-card.featured::before{
  content:'Neu';
  position:absolute;
  top:1rem;right:1rem;
  background:var(--accent);
  color:#fff;
  font-size:0.7rem;
  font-weight:500;
  padding:0.2rem 0.6rem;
  border-radius:20px;
  letter-spacing:0.04em;
}
.service-card.featured:hover{border-color:var(--accent-mid)}
.service-card.featured .service-icon{background:var(--accent);font-size:1.3rem}
.service-card.featured .data-pillars{
  margin-top:1rem;
  display:flex;
  flex-wrap:wrap;
  gap:0.4rem;
}
.service-card.featured .data-pillars span{
  font-size:0.75rem;
  color:var(--accent-mid);
  background:var(--accent-light);
  border:1px solid rgba(29,111,91,0.25);
  padding:0.2rem 0.6rem;
  border-radius:20px;
  font-weight:500;
}
.service-card.featured .btn-book{
  display:inline-block;
  margin-top:1.25rem;
  background:var(--accent);
  color:#fff;
  padding:0.65rem 1.4rem;
  border-radius:7px;
  font-size:0.875rem;
  font-weight:500;
  border:none;
  cursor:pointer;
  transition:background 0.2s;
  width:100%;
  text-align:center;
}
.service-card.featured .btn-book:hover{background:var(--accent-mid)}

.how-strip{background:var(--stone);padding:5rem 3rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.how-inner{max-width:1100px;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem;margin-top:3rem}
.step{text-align:center;padding:1.5rem 1rem}
.step-num{font-family:'DM Serif Display',serif;font-size:2.5rem;color:var(--accent-light);line-height:1;margin-bottom:0.75rem;-webkit-text-stroke:1.5px var(--accent)}
.step h3{font-size:0.95rem;font-weight:500;margin-bottom:0.4rem}
.step p{font-size:0.85rem;color:var(--muted);font-weight:300;line-height:1.6}

.demo-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:2.5rem;margin-bottom:1.5rem}
.demo-placeholder{background:var(--stone);border-radius:10px;height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.9rem;border:2px dashed var(--border);margin-top:1.5rem}

.promise-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-top:2rem}
.promise-item{padding:1.5rem;background:var(--stone);border-radius:10px}
.promise-check{color:var(--accent);font-size:1.1rem;margin-bottom:0.5rem}
.promise-item h4{font-size:0.95rem;font-weight:500;margin-bottom:0.25rem}
.promise-item p{font-size:0.85rem;color:var(--muted);font-weight:300}

.cta-band{background:var(--ink);color:#fff;padding:5rem 3rem;text-align:center}
.cta-band h2{color:#fff;font-family:'DM Serif Display',serif;font-size:2.5rem;margin-bottom:1rem}
.cta-band p{color:rgba(255,255,255,0.6);max-width:480px;margin:0 auto 2rem;font-weight:300}
.cta-contact{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
.cta-contact a{color:rgba(255,255,255,0.75);font-size:0.9rem;font-weight:300;transition:color 0.2s}
.cta-contact a:hover{color:#fff}
.btn-light{background:#fff;color:var(--ink);padding:0.9rem 2.25rem;border-radius:8px;font-size:0.95rem;font-weight:500;border:none;cursor:pointer}

footer{background:var(--ivory);border-top:1px solid var(--border);padding:2rem 3rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.footer-logo{font-family:'DM Serif Display',serif;font-size:1.1rem}
.footer-logo span{color:var(--accent)}
footer p{font-size:0.8rem;color:var(--muted)}
.footer-contact{display:flex;flex-wrap:wrap;gap:1.25rem;font-size:0.8rem;color:var(--muted)}
.footer-contact a{color:var(--muted);transition:color 0.2s}
.footer-contact a:hover{color:var(--ink)}
</style>
</head>
<body>

<nav>
  <div class="logo">smart<span>flow</span></div>
  <div class="nav-links">
    <a href="#leistungen">Leistungen</a>
    <a href="smartflow-chatbot-demo.html">Demos</a>
    <a href="#kontakt" class="nav-cta">Kontakt</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag">Smartflow GenAI Engine v1.0</div>
  <h1>Automatisierte ITIL-Prozesse für <em>Schweizer KMUs</em></h1>
  <p>Wir strukturieren unübersichtliche Daten, Verträge und SLAs und machen Ihr Firmenwissen im Handumdrehen KI-bereit – sicher, lokal und revisionskonform.</p>
</div>

</body>
</html>
